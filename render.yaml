# Render blueprint for ExamMind.
#
# Create it from the Render dashboard with New > Blueprint, pointed at this
# repository. Render reads this file and provisions all three resources in one
# go, wiring DATABASE_URL and the two service URLs between them automatically.
#
# Read DEPLOY.md before the first deploy -- there are two settings you have to
# fill in by hand (the AI provider key, and the frontend URL in CORS_ORIGINS)
# and one real constraint on the free plan around the embedding model's memory.

databases:
  - name: exammind-db
    databaseName: alms_db
    user: alms_user
    plan: free
    postgresMajorVersion: "16"

services:
  # ---- API -------------------------------------------------------------
  - type: web
    name: exammind-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /docs
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # $PORT is assigned by Render; binding anything else fails the health check.
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render hands this out as postgres://... ; database.py rewrites it to
      # postgresql+psycopg:// so SQLAlchemy uses psycopg 3, which is what
      # requirements.txt installs.
      - key: DATABASE_URL
        fromDatabase:
          name: exammind-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Pinned: fastembed and onnxruntime wheels lag the newest Python.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Must list the deployed frontend origin. Fill in after the first deploy,
      # once exammind-web has its URL -- see DEPLOY.md step 4.
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_SCHOOL_EMAIL_DOMAINS
        value: stu.cu.edu.ng,covenantuniversity.edu.ng
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_MODEL
        value: deepseek-chat
      - key: AI_FALLBACK_PROVIDER
        value: cohere
      - key: COHERE_MODEL
        value: command-r7b-12-2024
      # Secrets: set in the dashboard, never in this file.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_INDEX_CHUNKS
        value: "40"
      - key: MAX_RAG_QUESTION_CHARS
        value: "2000"
      - key: SQL_ECHO
        value: "false"

  # ---- frontend --------------------------------------------------------
  - type: web
    name: exammind-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Set by hand to the API's full origin, including https://.
      # Deliberately not `fromService: property: host` -- that yields a bare
      # hostname with no scheme, and api.ts concatenates it as
      # `${API_BASE_URL}${path}`, so every request would resolve as a relative
      # path against the frontend and quietly 404. See DEPLOY.md step 4.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Single-page app: every path has to fall through to index.html or a
      # deep link returns Render's 404 instead of the app.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
