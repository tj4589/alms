# Render blueprint for ExamMind: API + frontend, both on Render. The database
# is Neon -- see DEPLOY.md, which walks both providers in order.
#
# Render's own Postgres used to be declared here. It was dropped for Neon
# because Render's free database expires after 30 days, taking the data with
# it, while Neon's free tier does not. Nothing in the code changed: database.py
# already rewrites either provider's URL into the postgresql+psycopg:// form
# SQLAlchemy needs, and main.py enables pgvector on first boot, which Neon
# supports.
#
# Create it from the Render dashboard with New > Blueprint, pointed at this
# repository. It provisions both services below in one pass. Read DEPLOY.md
# first -- four API values and one frontend value have to be filled in by hand,
# and there is one real constraint around the embedding model's memory.

services:
  # ---- API -------------------------------------------------------------
  - type: web
    name: exammind-api
    # Docker rather than the native Python runtime, for OCR: pytesseract shells
    # out to a system `tesseract` binary that the native runtime has no way to
    # install. backend/Dockerfile apt-installs it. Because rootDir is backend,
    # both Docker paths below are relative to that directory. The image also
    # carries the build and start commands, so neither is declared here.
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /docs
    envVars:
      # Neon's pooled connection string, pasted in the dashboard. Use the
      # pooled one: database.py disables psycopg's prepared statements when it
      # sees "-pooler." in the host, because Neon's pooler is pgbouncer in
      # transaction mode and prepared statements break there once a query gets
      # hot. database.py also rewrites postgres:// into postgresql+psycopg://,
      # so either form Neon offers will work.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_HOST
        value: "0.0.0.0"
      - key: BACKEND_PORT
        value: "8000"
      # The deployed frontend origin used by the live web service.
      - key: CORS_ORIGINS
        value: https://exammind-web.onrender.com
      - key: ALLOWED_SCHOOL_EMAIL_DOMAINS
        value: stu.cu.edu.ng,covenantuniversity.edu.ng
      - key: FIREBASE_PROJECT_ID
        value: exammind-509123
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: FIREBASE_CERTS_URL
        value: https://www.googleapis.com/robot/v1/metadata/x509/securetoken@system.gserviceaccount.com
      - key: GOOGLE_CERTS_URL
        value: https://www.googleapis.com/oauth2/v3/certs
      - key: FIREBASE_CLOCK_SKEW_SECONDS
        value: "60"
      - key: FIREBASE_CERT_FETCH_TIMEOUT_SECONDS
        value: "10"
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_MODEL
        value: deepseek-chat
      - key: AI_FALLBACK_PROVIDER
        value: cohere
      - key: COHERE_MODEL
        value: command-r7b-12-2024
      # Secrets: set in the dashboard, never in this file.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_INDEX_CHUNKS
        value: "40"
      - key: MAX_RAG_QUESTION_CHARS
        value: "2000"
      - key: SQL_ECHO
        value: "false"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: DB_DISABLE_PREPARE
        value: "false"
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: MIN_INDEXABLE_TEXT_CHARS
        value: "80"
      - key: MAX_OCR_PAGES
        value: "20"
      - key: OCR_RENDER_SCALE
        value: "4"
      - key: OCR_FALLBACK_RENDER_SCALE
        value: "3"
      - key: EXAMMIND_DEBUG_METADATA
        value: "false"
      - key: APP_ENV
        value: production
      - key: ENV
        value: production
      - key: HEARTBEAT_TIMEOUT_SECONDS
        value: "120"
      # Set to "true" to never load the embedding model. Keeps the service at
      # ~205MB instead of ~359MB; search falls back to keyword ranking, which
      # every consumer already handles.
      - key: DISABLE_LOCAL_EMBEDDINGS
        value: "false"

  # ---- Frontend ----------------------------------------------------------
  - type: web
    name: exammind-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the bundle at build time by Vite, not read at runtime.
      # Baked into the bundle at build time by Vite. Must include the scheme
      # (https://) and no trailing slash.
      - key: VITE_API_BASE_URL
        value: https://exammind-api.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: exammind-509123.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: exammind-509123
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: exammind-509123.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "290862287209"
      - key: VITE_FIREBASE_APP_ID
        value: 1:290862287209:web:850bada52a1fc81ed495f8
    routes:
      # The app has no client-side router -- screens are component state --
      # so there are no deep links today. This is a no-cost safety net if
      # that ever changes: without it, refreshing on anything but `/` 404s.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
