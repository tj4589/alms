# Render blueprint for the ExamMind API.
#
# This file provisions the backend only. The database is Neon and the frontend
# is Vercel -- see DEPLOY.md, which walks all three in order.
#
# Render's own Postgres used to be declared here. It was dropped for Neon
# because Render's free database expires after 30 days, taking the data with
# it, while Neon's free tier does not. Nothing in the code changed: database.py
# already rewrites either provider's URL into the postgresql+psycopg:// form
# SQLAlchemy needs, and main.py enables pgvector on first boot, which Neon
# supports.
#
# Create it from the Render dashboard with New > Blueprint, pointed at this
# repository. Read DEPLOY.md first -- three values have to be filled in by
# hand, and there is one real constraint around the embedding model's memory.

services:
  # ---- API -------------------------------------------------------------
  - type: web
    name: exammind-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /docs
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # $PORT is assigned by Render; binding anything else fails the health check.
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Neon's pooled connection string, pasted in the dashboard. Use the
      # pooled one: database.py disables psycopg's prepared statements when it
      # sees "-pooler." in the host, because Neon's pooler is pgbouncer in
      # transaction mode and prepared statements break there once a query gets
      # hot. database.py also rewrites postgres:// into postgresql+psycopg://,
      # so either form Neon offers will work.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Pinned: fastembed and onnxruntime wheels lag the newest Python.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Must list the deployed frontend origin. Fill in after the first deploy,
      # once exammind-web has its URL -- see DEPLOY.md step 4.
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_SCHOOL_EMAIL_DOMAINS
        value: stu.cu.edu.ng,covenantuniversity.edu.ng
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_MODEL
        value: deepseek-chat
      - key: AI_FALLBACK_PROVIDER
        value: cohere
      - key: COHERE_MODEL
        value: command-r7b-12-2024
      # Secrets: set in the dashboard, never in this file.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_INDEX_CHUNKS
        value: "40"
      - key: MAX_RAG_QUESTION_CHARS
        value: "2000"
      - key: SQL_ECHO
        value: "false"
      # Set to "true" to never load the embedding model. Keeps the service at
      # ~205MB instead of ~359MB; search falls back to keyword ranking, which
      # every consumer already handles.
      - key: DISABLE_LOCAL_EMBEDDINGS
        value: "false"

# The frontend is not declared here: it is deployed to Vercel, which builds the
# same `npm run build` output. Render's static site is still a workable option
# if you would rather keep everything on one provider -- DEPLOY.md says what to
# add back.
